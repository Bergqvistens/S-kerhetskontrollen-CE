<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<title>Säkerhetskontroll CE</title>
<style>
/* Layout: one column of editable numbered rows, sticky header, bottom sheet for editing/naming */
:root{
  --bg:#eef1f3; --surface:#ffffff; --fg:#1b252d; --muted:#5b6872; --line:#d3d9de;
  --accent:#e0a100; --accent-ink:#1b252d; --frame:#1f4e8c;
  --bad:#c2352b; --bad-bg:#fbe6e3; --ok:#1f8a4c; --ok-bg:#e3f4ea;
  --shade:rgba(15,22,28,.45);
  --display:"Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12181d; --surface:#1b242b; --fg:#e7ecef; --muted:#9aa7b0; --line:#2e3a43;
  --accent:#f0b429; --accent-ink:#12181d; --bad:#f07468; --bad-bg:#3d1c1a; --ok:#4cc781; --ok-bg:#163525;
  --shade:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12181d; --surface:#1b242b; --fg:#e7ecef; --muted:#9aa7b0; --line:#2e3a43;
  --accent:#f0b429; --accent-ink:#12181d; --bad:#f07468; --bad-bg:#3d1c1a; --ok:#4cc781; --ok-bg:#163525;
  --shade:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.4;padding-bottom:env(safe-area-inset-bottom,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header .wrap{padding-block:12px;display:grid;gap:8px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(20px,6vw,26px);white-space:nowrap;letter-spacing:.02em;margin:0;text-transform:uppercase;line-height:1}
h1 span{display:inline-block;background:var(--accent);color:var(--accent-ink);padding:2px 7px;margin-left:6px;border-radius:3px}
.status{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
.chip{font-variant-numeric:tabular-nums;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--bg);color:var(--fg)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
main .wrap{padding-block:16px 40px;display:grid;gap:14px}
.note{margin:0;color:var(--muted);font-size:15px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{font:600 15px var(--body);padding:11px 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.slot:focus-visible,.icon:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
ol.slots{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.row{display:grid;grid-template-columns:1fr auto;align-items:stretch;border:2px solid var(--frame);border-radius:6px;background:var(--surface)}
.row.sel{border-color:var(--accent);border-width:2px;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
.picking .row:not(.sel){border-style:dashed}
.slot{display:grid;grid-template-columns:36px 1fr;gap:8px;align-items:start;text-align:left;padding:10px 4px 10px 10px;border:0;background:none;color:var(--fg);font:400 15px/1.35 var(--body);cursor:pointer;min-width:0;border-radius:6px 0 0 6px}
.num{font-family:var(--display);font-weight:700;font-size:22px;line-height:1;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:1px}
.row.sel .num{color:var(--accent)}
.txt{min-width:0;overflow-wrap:anywhere}
.edited{display:inline-block;margin-left:6px;font-size:12px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:0 7px}
.tools{display:flex;flex-direction:column;border-left:1px solid var(--line)}
.icon{flex:1;min-width:46px;min-height:40px;border:0;background:none;color:var(--fg);cursor:pointer;display:grid;place-items:center}
.icon+.icon{border-top:1px solid var(--line)}
.icon svg{width:20px;height:20px}
.icon.del{color:var(--bad)}
.footer-row .num{font-size:14px;padding-top:3px;text-transform:uppercase;letter-spacing:.03em}
.footer-row .slot{grid-template-columns:1fr;cursor:default}
.footer-row .txt{font-weight:600}
.lbl{font:600 13px var(--body);color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:6px 0 -6px}
.hint{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--fg);color:var(--bg);padding:10px 12px;border-radius:8px;font-weight:600;z-index:4}
.hint .btn{padding:7px 12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--accent);color:var(--accent-ink);padding:10px 16px;border-radius:8px;font-weight:600;z-index:30;box-shadow:0 4px 14px var(--shade);max-width:calc(100% - 32px)}
.sheet-bg{position:fixed;inset:0;background:var(--shade);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:720px;max-height:88vh;overflow-y:auto;border-radius:14px 14px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:12px}
.sheet h2{font-family:var(--display);font-size:22px;margin:0;text-transform:uppercase;letter-spacing:.02em}
.sheet p{margin:0;color:var(--muted);font-size:15px}
.sheet .quote{color:var(--fg);background:var(--bg);border-radius:6px;padding:10px 12px}
textarea,input[type=text]{width:100%;font:400 16px/1.4 var(--body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
textarea{min-height:140px;resize:vertical}
.field{display:grid;gap:6px}
.field label{font-weight:600;font-size:15px}
.suffix{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px}
.suffix span{color:var(--muted);font-weight:600}
.err{color:var(--bad);font-weight:600;font-size:14px}
.sheet .actions{justify-content:flex-end}
.sheet .actions .left{margin-right:auto}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>Säkerhetskontroll <span>CE</span></h1>
  <div class="status" id="status"></div>
</div></header>

<main><div class="wrap" id="view"></div></main>
<div id="sheet" hidden></div>
<div class="toast" id="toast" hidden role="status" aria-live="polite"></div>

<script>
"use strict";
const DEFAULT_POINTS=["Kolla lappen i dörren med besiktningen & att däckstorleken på drivaxeln är korrekt. Sätt i färdskrivarkortet/OUT-läge. Kontrollera att datum och mätarställning stämmer. Kolla om det finns 6 rullar. Sätt färdskrivaren i ”Annat arbete” under säkerhetskontrollen.",
"Kolla oljan invändigt samt bilens & släpets axeltryck.",
"Töm lufttankarna (lågtrycksindikatorn).",
"Starta och ladda upp trycket igen.",
"Under tiden trycket laddas: kontrollera tutan, spolarvätskan/vindrutetorkarna och fläkten (defrosten).",
"Starta bakgavellyften.",
"Gå bak och kolla bakgavellyften och lasten inne i skåpet. Alternativt öppna sidodörrarna om dessa finns.",
"Lyssna så dräneringsventilen ”nyser”. Då är lufttankarna fulla.",
"Kontrollera styrservon, samtidigt som du ställer upp lastbilen för att koppla släpet.",
"Lås P-bromsen på släpet (den röda knappen). Dra ut knappen.",
"Tryck in Rangerventilen för att framaxeln ska bli mer rörlig vid tillbackning (den svarta knappen).",
"Koppla släpet. Kontrollera att släpet är låst med bilen samt koppla el & luft.",
"Kolla drag & dragstång efter skador på lastbil & släp samt kolla bultarna på släpets svängkrans.",
"Testa att köra iväg för att testa släpets P-broms.",
"Koppla ur luftslangarna som är kopplade i bilen från släpet (katastrofbromsen).",
"Släpp P-bromsen på släpet.",
"Testa att köra iväg igen för att testa släpets katastrofbroms.",
"Stäng av bilen och starta halvljuset och vänster blinkers.",
"Kila fast varningstriangeln mot färdbromsen och förarstolen, för att själv kolla eller be någon hjälpa dig kontrollera att bromsljuset lyser.",
"Kolla innanför motorhuven: vätskor och olja, samt kolla under bilen efter läckage.",
"Kontrollera däcken och lufttankarna på vänster sida av lastbilen. Kolla blinkers & reflexer. Ta med hammaren.",
"Koppla slangarna igen (katastrofbromsen släp).",
"Kolla däcken och lufttankarna på vänster sida på släpet. Kolla blinkers & reflexer.",
"Kolla belysningen bak.",
"Gå in och kontrollera lasten på släpet.",
"Ta bort varningstriangeln.",
"Byt till helljuset och höger blinkers.",
"Kolla däcken på höger sida av bilen. Kolla blinkers & reflexer.",
"Kolla drag/dragstången från höger sida samt kolla bultarna på släpets svängkrans.",
"Kolla däcken på höger sida av släpet.",
"Kontrollera höger blinkers och skåpen utvändigt. Kolla reflexer.",
"Kontrollera färdbromsen.",
"Kontrollera P-bromsen.",
"Kör och kontrollera släpvagnsbromsen.",
"Stäng av bilen och gör täthetskontrollen i 30 sek."];
const DEFAULT_FOOTER="Sen är du klar med säkerhetskontrollen för CE.";
const DEFAULT_NAME="Säkerhetskontroll CE";
const KEY="sakerhetskontroll-ce-lista-v2";
const ICON_EDIT='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M14 6l4 4"/></svg>';
const ICON_DEL='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 13h10l1-13"/><path d="M9 7V4h6v3"/></svg>';

/* ---------- data (kept only in this phone's browser storage) ---------- */
let seq=0;
function defaults(){return{items:DEFAULT_POINTS.map((t,i)=>({id:"p"+i,text:t,orig:t})),footer:DEFAULT_FOOTER,name:DEFAULT_NAME}}
function valid(d){return d&&Array.isArray(d.items)&&d.items.every(x=>x&&typeof x.id==="string"&&typeof x.text==="string"&&(x.orig===null||typeof x.orig==="string"))&&typeof d.footer==="string"&&typeof d.name==="string"}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(valid(d))return d}catch(e){}return null}
let storeOk=true;
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));storeOk=true}catch(e){storeOk=false}renderStatus()}
let data=load()||defaults();
const newId=()=>"n"+Date.now().toString(36)+(seq++);

/* ---------- helpers ---------- */
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const clean=s=>s.replace(/\s+/g," ").trim();
let toastT;function toast(m){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}
let sel=null;

function renderStatus(){
  $("status").innerHTML=(storeOk?'<span class="chip ok">Sparas bara i den här telefonen</span>':'<span class="chip">Kunde inte spara – ändringar försvinner när sidan stängs</span>')+'<span class="chip">'+data.items.length+' punkter</span>';
}

function render(){
  renderStatus();
  let h='<p class="note">Tryck på en punkt för att markera den, och tryck sedan där den ska ligga. Pennan ändrar texten och papperskorgen tar bort punkten. Allt sparas automatiskt.</p>';
  h+='<ol class="slots'+(sel!==null?' picking':'')+'">';
  data.items.forEach((it,i)=>{
    const ed=it.orig===null?'<span class="edited">Ny</span>':(it.text!==it.orig?'<span class="edited">Ändrad</span>':'');
    h+='<li><div class="row'+(i===sel?' sel':'')+'"><button class="slot" data-i="'+i+'"><span class="num">'+(i+1)+'</span><span class="txt">'+esc(it.text)+ed+'</span></button>'+
       '<div class="tools"><button class="icon" data-edit="'+i+'" aria-label="Ändra punkt '+(i+1)+'">'+ICON_EDIT+'</button><button class="icon del" data-del="'+i+'" aria-label="Ta bort punkt '+(i+1)+'">'+ICON_DEL+'</button></div></div></li>';
  });
  h+='</ol>';
  h+='<div class="actions"><button class="btn" id="add">+ Lägg till punkt</button></div>';
  h+='<div class="lbl">Avslutningsrad</div>';
  const fEd=data.footer!==DEFAULT_FOOTER?'<span class="edited">Ändrad</span>':'';
  h+='<div class="row footer-row"><div class="slot"><span class="txt">'+(data.footer?esc(data.footer):'<i>(ingen avslutningsrad)</i>')+fEd+'</span></div><div class="tools"><button class="icon" id="editfooter" aria-label="Ändra avslutningsraden">'+ICON_EDIT+'</button></div></div>';
  h+='<div class="actions"><button class="btn primary" id="pdf"'+(data.items.length?'':' disabled')+'>Klar – ladda ned PDF</button><button class="btn" id="resetall">Återställ allt</button></div>';
  if(sel!==null)h+='<div class="hint"><span>Punkt '+(sel+1)+' markerad. Tryck där den ska ligga.</span><button class="btn" id="unsel">Avmarkera</button></div>';
  $("view").innerHTML=h;

  document.querySelectorAll(".slots .slot").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i;
    if(sel===null){sel=i;render();return}
    if(sel===i){sel=null;render();return}
    const from=sel,moved=data.items.splice(from,1)[0];data.items.splice(i,0,moved);sel=null;save();render();
    toast("Flyttad från plats "+(from+1)+" till plats "+(i+1));
    const el=document.querySelector('.slot[data-i="'+i+'"]');el&&el.focus({preventScroll:true});
  });
  document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{sel=null;editItem(+b.dataset.edit)});
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{sel=null;confirmDelete(+b.dataset.del)});
  $("add").onclick=()=>{sel=null;addItem()};
  $("editfooter").onclick=()=>{sel=null;editFooter()};
  $("pdf").onclick=()=>{sel=null;askName()};
  $("resetall").onclick=()=>{sel=null;confirmResetAll()};
  if(sel!==null)$("unsel").onclick=()=>{sel=null;render()};
}

/* ---------- sheets ---------- */
let lastFocus=null;
function openSheet(html,setup){
  lastFocus=document.activeElement;
  clearTimeout(toastT);$("toast").hidden=true;
  const s=$("sheet");
  s.innerHTML='<div class="sheet-bg" id="sheetbg"><div class="sheet" role="dialog" aria-modal="true">'+html+'</div></div>';
  s.hidden=false;document.body.style.overflow="hidden";
  $("sheetbg").onclick=e=>{if(e.target.id==="sheetbg")closeSheet()};
  s.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeSheet);
  setup&&setup(s);
}
function closeSheet(){$("sheet").hidden=true;$("sheet").innerHTML="";document.body.style.overflow="";render();if(lastFocus&&lastFocus.id&&$(lastFocus.id))$(lastFocus.id).focus({preventScroll:true})}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("sheet").hidden)closeSheet()});

function textSheet(title,value,orig,onSave,emptyAllowed){
  const canReset=orig!==null&&orig!==undefined;
  openSheet('<h2>'+esc(title)+'</h2><div class="field"><textarea id="ta" aria-label="Text">'+esc(value)+'</textarea></div><div class="err" id="err" hidden>Texten kan inte vara tom.</div>'+
    '<div class="actions">'+(canReset?'<button class="btn left" id="restore">Återställ original</button>':'')+'<button class="btn" data-close>Avbryt</button><button class="btn primary" id="ok">Spara</button></div>',s=>{
    const ta=$("ta");ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length);
    if(canReset)$("restore").onclick=()=>{ta.value=orig;ta.focus()};
    $("ok").onclick=()=>{const v=clean(ta.value);if(!v&&!emptyAllowed){$("err").hidden=false;ta.focus();return}onSave(v);closeSheet()};
  });
}
function editItem(i){const it=data.items[i];textSheet("Ändra punkt "+(i+1),it.text,it.orig,v=>{if(v!==it.text){it.text=v;save();toast("Punkt "+(i+1)+" är ändrad")}})}
function addItem(){textSheet("Ny punkt "+(data.items.length+1),"",null,v=>{data.items.push({id:newId(),text:v,orig:null});save();toast("Punkt "+data.items.length+" är tillagd. Flytta den dit den ska ligga.")})}
function editFooter(){textSheet("Ändra avslutningsraden",data.footer,DEFAULT_FOOTER,v=>{if(v!==data.footer){data.footer=v;save();toast(v?"Avslutningsraden är ändrad":"Avslutningsraden är borttagen")}},true)}

function confirmDelete(i){
  const it=data.items[i];
  openSheet('<h2>Ta bort punkt '+(i+1)+'?</h2><p>Vill du ta bort punkten?</p><p class="quote">'+esc(it.text)+'</p><div class="actions"><button class="btn" data-close>Avbryt</button><button class="btn danger" id="ok">Ta bort</button></div>',()=>{
    $("ok").onclick=()=>{data.items.splice(i,1);save();closeSheet();toast("Punkten är borttagen")};
    $("ok").focus();
  });
}
function confirmResetAll(){
  openSheet('<h2>Återställ allt?</h2><p>Alla '+DEFAULT_POINTS.length+' ursprungliga punkter kommer tillbaka i ursprunglig ordning med originaltexterna. Dina ändringar, nya punkter, avslutningsraden och filnamnet försvinner.</p><div class="actions"><button class="btn" data-close>Avbryt</button><button class="btn danger" id="ok">Återställ allt</button></div>',()=>{
    $("ok").onclick=()=>{data=defaults();save();closeSheet();toast("Allt är återställt")};
  });
}

/* ---------- file name + PDF ---------- */
const BAD_CHARS=/[\\/:*?"<>|\u0000-\u001f]/g;
function askName(){
  openSheet('<h2>Ladda ned PDF</h2><div class="field"><label for="fn">Filnamn (blir också rubriken i PDF:en)</label><div class="suffix"><input type="text" id="fn" maxlength="120" autocomplete="off" value="'+esc(data.name)+'"><span>.pdf</span></div></div><div class="err" id="err" hidden></div>'+
    '<p>PDF:en sparas bara i den här telefonen. Din senaste version finns kvar här i appen så att du kan fortsätta ändra.</p><div class="actions"><button class="btn" data-close>Avbryt</button><button class="btn primary" id="ok">Ladda ned</button></div>',()=>{
    const fn=$("fn");fn.focus();fn.select();
    const go=()=>{
      let v=clean(fn.value.replace(BAD_CHARS," ")).replace(/\.pdf$/i,"").trim();
      if(!v){$("err").textContent="Skriv ett filnamn.";$("err").hidden=false;fn.focus();return}
      data.name=v;save();closeSheet();downloadPdf(v);
    };
    $("ok").onclick=go;fn.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();go()}};
  });
}

/* Inside Claude the page offers the file through the platform; on any other site (e.g. GitHub Pages) a normal download link is used. Nothing is sent over the network. */
const dlP=(window.claude&&typeof window.claude.use==="function")?window.claude.use("downloads").catch(()=>null):Promise.resolve(null);
let pdfBusy=false;
async function downloadPdf(name){
  if(pdfBusy)return;pdfBusy=true;
  try{
    const bytes=makeListPdf(name,data.items.map(x=>x.text),data.footer);
    const filename=name+".pdf";
    const dl=await dlP;
    if(dl){
      try{const r=await dl.save({filename,data:bytes});toast(r&&r.status==="delivered"?"PDF:en är skickad":"PDF:en ”"+filename+"” är nedladdad")}
      catch(e){const c=e&&e.code;toast(c==="declined"?"Nedladdningen avbröts":c==="rate_limited"?"Vänta lite och försök igen":"Kunde inte ladda ned PDF:en")}
      return;
    }
    const url=URL.createObjectURL(new Blob([bytes],{type:"application/pdf"}));
    const a=document.createElement("a");a.href=url;a.download=filename;a.rel="noopener";document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),60000);
    toast("PDF:en ”"+filename+"” är nedladdad");
  }catch(e){toast("Kunde inte skapa PDF:en")}
  finally{pdfBusy=false}
}
